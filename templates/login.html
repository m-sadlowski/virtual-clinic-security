{% extends "base.html" %}

{% block title %}Login - Virtual Clinic Auth{% endblock %}

{% block content %}
<h1 class="h3">Login</h1>
<form method="post" class="mt-3" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            value="{{ email or '' }}"
            required
        >
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            required
        >
    </div>

    <button type="submit" class="btn btn-primary">Login</button>
</form>
{% endblock %}
